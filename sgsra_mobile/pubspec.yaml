name: sgsra_mobile
description: "Frontend corporativo SGSRA-MD para la gestión logística de Master Drilling Perú S.A."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Manejo de Estado Reactivo Centralizado
  flutter_bloc: ^8.1.6

  # Cliente de Red e Interceptores para Spring Boot
  dio: ^5.5.0

  # Criptografía y Persistencia Segura (KeyStore / Android)
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0
  sqflite_sqlcipher: ^3.2.0+1
  local_auth: ^2.1.8

  # Control de Sensores Nativos (Cámara para códigos de barra, QR y Conectividad Híbrida)
  mobile_scanner: ^7.1.0
  # Generación del código QR de cada herramienta (etiqueta para el escáner de Retorno)
  qr_flutter: ^4.1.0
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/repuestos/
    - assets/images/herramientas/
