spring.application.name=sgsra-md

server.port=8080

# Configuracion de Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sgsra_md_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate
# 'update' valida y crea/actualiza tablas segun las entidades Java sin borrar datos existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Formato de Fechas y Zona Horaria para auditoria y transacciones
spring.jackson.time-zone=America/Lima
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss